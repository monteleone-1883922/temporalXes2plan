<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ config_name }} — XES2Plan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Cytoscape.js -->
    <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>

    <link rel="stylesheet" href="/static/css/style.css">

    <script>const CONFIG_NAME = "{{ config_name }}"; const INITIAL_VERSION = "{{ initial_version }}";</script>
</head>
<body>

    <!-- Navbar -->
    <nav class="app-navbar">
        <div style="display:flex;align-items:center;gap:12px;">
            <a href="/project/{{ config_name }}" class="btn-toolbar btn-home">
                <i class="bi bi-arrow-left"></i> Home
            </a>
            <div class="brand" style="gap:8px;">
                <span class="brand-icon"><i class="bi bi-diagram-3"></i></span>
                <span style="color:#fff;">XES2Plan</span>
                <span style="color:#475569;font-weight:400;">/ {{ config_name }}</span>
            </div>
        </div>

        <div class="toolbar">
            <button id="btn-current" class="btn-toolbar btn-version active" onclick="loadVersion('current')">
                <i class="bi bi-pencil-square"></i> Current
            </button>
            <button id="btn-original" class="btn-toolbar btn-version" onclick="loadVersion('original')">
                <i class="bi bi-archive"></i> Original
            </button>

            <div class="toolbar-sep"></div>

            <button class="btn-toolbar btn-reset" onclick="resetToCurrent()">
                <i class="bi bi-arrow-counterclockwise"></i> Reset
            </button>
            <button class="btn-toolbar btn-export" onclick="exportConfig()">
                <i class="bi bi-download"></i> Export
            </button>
            <label class="btn-toolbar btn-import">
                <i class="bi bi-upload"></i> Import
                <input type="file" accept=".json" hidden onchange="importConfig(event)">
            </label>
        </div>
    </nav>

    <!-- Main layout -->
    <div id="main-container">
        <!-- Graph canvas -->
        <div id="cy-container">
            <div id="cy"></div>
        </div>

        <!-- Detail panel -->
        <div id="detail-panel" class="d-none">
            <div class="panel-header">
                <div class="panel-header-title">
                    <div class="panel-header-icon" id="panel-header-icon">
                        <i class="bi bi-toggles"></i>
                    </div>
                    <h5 id="panel-title"></h5>
                </div>
                <button class="panel-close" onclick="closePanel()">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div id="panel-content"></div>
        </div>
    </div>

    <script src="/static/js/graph.js"></script>
    <script src="/static/js/panels.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
