<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}XES2Plan{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block extra_css %}{% endblock %}
    {% block head_scripts %}{% endblock %}
</head>
<body class="{% block body_class %}page-scrollable{% endblock %}"{% block body_data %}{% endblock %}>

    <nav class="app-navbar">
        <div class="navbar-left">
            {% block nav_back %}{% endblock %}
            <div class="brand">
                <span class="brand-icon"><i class="bi bi-diagram-3"></i></span>
                XES2Plan<span class="navbar-breadcrumb">{% block nav_breadcrumb %}{% endblock %}</span>
            </div>
        </div>
        {% block nav_right %}{% endblock %}
    </nav>

    {% block content %}{% endblock %}

    {% block extra_scripts %}{% endblock %}
</body>
</html>
